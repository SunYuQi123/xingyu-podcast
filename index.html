<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; media-src https:; style-src 'self'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星屿 · 播客</title><link rel="stylesheet" href="style.css"></head><body><aside><div class="brand"><span class="mark">✳</span><div><strong>星屿</strong><small>YOUR LISTENING SPACE</small></div></div><div class="side-label">探索你的声音</div><button class="nav active" id="subscriptions">◉　我的订阅</button><button class="nav" id="history">◷　最近收听</button><button class="nav" id="queue-nav">☷　播放队列 <span id="queue-count"></span></button><button class="nav" id="discover">⌕　搜索播客</button><div class="sidebar-foot"><div class="account" id="account">未登录</div><button class="quiet" id="logout" hidden>退出登录</button><p>个人使用 · 非官方客户端</p></div></aside><main><header><div><div class="eyebrow">A LITTLE SPACE TO LISTEN</div><h1 id="heading">我的订阅</h1><p id="subtitle">让喜欢的声音，陪你度过每一天。</p></div><button class="refresh" id="refresh">↻　刷新</button></header><div id="message" role="status"></div><section id="login" hidden><div class="login-card"><div class="orbit">✳</div><div class="eyebrow">WELCOME BACK</div><h2>把手机里的声音<br>带到电脑上。</h2><p>打开手机小宇宙，在发现页面点击搜索框旁的扫一扫，扫描二维码并确认登录。</p><div class="qrbox"><img id="qr" alt="小宇宙扫码登录二维码" hidden><div id="qrstatus">正在生成二维码…</div></div><button class="primary" id="newqr">刷新二维码</button><small>登录凭据使用 Windows 加密保存在本机。本客户端使用非官方接口。</small></div></section><section id="searchbar" hidden><input id="query" placeholder="搜索节目，例如：商业、电影、生活…"><button class="primary" id="search">搜索</button></section><div id="breadcrumb" hidden></div><section id="content" class="grid"></section><button id="more" class="more" hidden>加载更多</button></main><footer><div class="now"><div class="cover-placeholder">♫</div><div><strong id="playing">还没有播放内容</strong><small id="playing-sub">选择一集播客，开始收听</small></div></div><audio id="audio" controls preload="metadata"></audio><div class="play-options"><label>倍速 <select id="speed" aria-label="播放倍速"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label><label>定时 <select id="sleep" aria-label="定时关闭"><option value="0">关闭</option><option value="15">15 分钟</option><option value="30">30 分钟</option><option value="45">45 分钟</option><option value="60">60 分钟</option><option value="end">本集结束</option></select></label><span id="sleep-status" aria-live="polite"></span></div><div id="sync-status" class="footnote" role="status">进度待同步</div></footer><script src="renderer.js"></script></body></html>
